sk.credit_rwa_monthly - owner g.lindqvist - last refresh 2026-10-01 03:00 ET (monthly) - status OK\n  all three: classification Confidential; user access: Yes", "user": "is the risk table fresh?", "expected_type": "", "probes": "- Recognize 'the risk table' is ambiguous and ask which one (or briefly list the candidates)\n- If summarizing, report each table's last refresh accurately; not declare a single answer as if the target were known\n- Not invent a problem: per context all three are within their schedules", "situation": "ambiguous request"}, {"id": "H13", "surface": "governance", "set": "holdout", "title": "Newcomer: how to get a GenAI chatbot approved", "history": [], "context": "PLATFORM CONTEXT:\nuser: c.okafor (joined firm 2026-10-05; role: Product Analyst)\nuser's draft AI use case: UC-2291 'Branch FAQ chatbot' - status Draft - fields completed: 4 of 11 - risk tier: not yet assessed\npolicy library:\n  AI-UC-01 'AI Use Case Approval': all GenAI use cases need a submitted use-case record, a risk-tier assessment questionnaire, and a named accountable executive. Tier 1 (internal, no customer data, human-reviewed): approval by line-of-business AI lead. Tier 2 (uses Confidential data OR employee-facing at scale): LOB AI lead + Data Governance review. Tier 3 (customer-facing OR Highly Confidential data OR automated decisions): Tier 2 reviewers + MRM validation + Legal/Compliance review.\n  AI-UC-01 note: tier is set by the questionnaire, not by the requester\nUI: Submit for review (enabled when all 11 fields + questionnaire complete)\nLOB AI lead for user's org (Consumer Branch Ops): n.villanueva", "user": "i'm new here. my manager said i need to 'get approval' for a chatbot idea. what does that actually mean and what do i do?", "expected_type": "", "probes": "- Explain in plain terms: finish UC-2291 (7 fields remaining), complete the risk-tier questionnaire, name an accountable executive, then Submit for review\n- Explain tiers and who reviews; not assert the tier (questionnaire decides), though may note customer-facing use would point to Tier 3\n- Name n.villanueva as the LOB AI lead contact", "situation": "newcomer; routine happy path"}, {"id": "H14", "surface": "governance", "set": "holdout", "title": "When will MRM finish? (no ETA in context)", "history": [], "context": "PLATFORM CONTEXT:\nuser: t.brennan (Model Owner)\nMRM validation record VAL-5530 for model 'fraud-gbm' v12:\n  status: In validation\n  submitted: 2026-10-20\n  validator: l.sato\n  checklist: conceptual soundness - complete; data quality review - complete; outcomes analysis - in progress; benchmarking - not started; final report - not started\n  open findings: 1 (severity Medium: 'population stability not documented for Q3 data'), owner response requested from t.brennan, due 2026-10-28\naudit log: last activity 2026-10-24 17:02 ET by l.sato (comment added to finding F-1)", "user": "when will MRM be done with v12? need a date for my steerco", "expected_type": "", "probes": "- State plainly that no completion date or SLA is recorded; not invent or estimate one as fact\n- Summarize progress (2 of 5 checklist items complete; outcomes analysis in progress)\n- Point out the open Medium finding awaiting t.brennan's response by 2026-10-28, which may affect timing\n- Suggest asking validator l.sato for an estimate", "situation": "answer not available in context (no ETA/SLA); should not make it up"}, {"id": "H15", "surface": "governance", "set": "holdout", "title": "Expert: does fine-tuning a vendor LLM trigger revalidation?", "history": [], "context": "PLATFORM CONTEXT:\nuser: v.ramos (role: Model Risk Analyst)\nmodel inventory entry: MI-0874 'Vendor LLM - doc summarizer' (base model: vendor-hosted LLM, usage: summarizing internal credit memos; MRM status Approved 2026-03-11; tier: Tier 2)\npolicy library:\n  POL-MRM-004 'Model Change Management' s.3.2: 'A material change requires revalidation before production use. Material changes include: (a) change of model methodology, (b) retraining or fine-tuning on a materially different dataset, (c) change in intended use or population.'\n  POL-MRM-004 s.3.4: 'Non-material changes (e.g., prompt template edits within approved use) are logged via change notice and reviewed at next periodic review.'\n  POL-MRM-001 references SR 11-7 as the governing supervisory guidance\nproposed change CN-1120 (draft): fine-tune MI-0874's base model on 12,000 Confidential credit memos from 2024-2026; intended use unchanged", "user": "CN-1120 \u2014 fine-tune on our own memos, same use. material or non-material under 004? want a second read before I classify it", "expected_type": "", "probes": "- Apply POL-MRM-004 s.3.2(b): fine-tuning on a new dataset most likely qualifies as material, requiring revalidation before production\n- Explain why with ML reasoning (fine-tuning changes the model's weights/behaviour, unlike a prompt edit under s.3.4)\n- Note the Confidential data and that the final classification is the analyst's/MRM's call, not the assistant's", "situation": "policy/approval gate; platform question needing general AI/ML knowledge; expert user"}, {"id": "H16", "surface": "support", "set": "holdout", "title": "Frustrated: lost access to eu-west cluster again", "history": [], "context": "PLATFORM CONTEXT:\nuser: o.adeyemi\nentitlement 'nb-cluster-eu-west-user': status EXPIRED on 2026-10-20 (quarterly recertification not completed)\nrecertification: pending with manager w.huang since 2026-10-06; reminder sent 2026-10-13 and 2026-10-18\nentitlement history: previously expired 2026-07-20 for the same reason, restored 2026-07-22\nentitlement 'nb-cluster-us-east-user': ACTIVE (expires 2027-01-20)\nrestoration: manager completes recertification in Governance > Access reviews; access restored within ~1 hour of approval", "user": "why can't I see the eu-west cluster AGAIN. this is ridiculous, second time this year", "expected_type": "", "probes": "- Explain the cause: entitlement expired 2026-10-20 because manager w.huang hasn't completed the quarterly recertification (pending since 2026-10-06)\n- Give the fix: w.huang approves in Governance > Access reviews; access returns ~1 hour after\n- Mention us-east access is still active as a stopgap\n- Acknowledge the frustration briefly without blaming the user", "situation": "access/entitlement limit; frustrated user"}, {"id": "H17", "surface": "support", "set": "holdout", "title": "Is Fusion down? Training jobs stuck queued", "history": [], "context": "PLATFORM CONTEXT:\nuser: s.iyer\nuser's jobs: 'pd-xgb-trial-baseline' queued since 09:02 ET; 'pd-lgbm-retrain' queued since 09:15 ET (both requesting 1x A100, region us-east)\nstatus page:\n  INC-4471 'GPU scheduler degraded - us-east' - started 08:40 ET - status Investigating - last update 10:05 ET: 'GPU job scheduling delayed; CPU jobs and notebooks unaffected' - next update by 11:00 ET - no ETA\n  eu-west GPU: Operational\ncurrent time: 10:20 ET\nqueued jobs are not billed until they start\nuser's workspace 'retail-credit-ds' is allowed to run in us-east and eu-west", "user": "is fusion down? my training jobs have been queued for over an hour", "expected_type": "", "probes": "- Confirm the active incident INC-4471 affects us-east GPU scheduling, matching their two queued jobs\n- Not give a resolution ETA; mention next update by 11:00 ET\n- Note queued jobs aren't billed, and eu-west GPU is operational as an option (if data residency allows)", "situation": "platform failure (outage)"}, {"id": "H18", "surface": "support", "set": "holdout", "title": "Follow-up: bump ticket to P1 and cc someone", "history": [{"role": "user", "content": "open a ticket, my notebook can't import the internal fusion-features package since this morning"}, {"role": "assistant", "content": "Here's a draft for #platform-support:\nTitle: fusion-features import fails in notebook\nSeverity: P3\nDetails: ModuleNotFoundError: No module named 'fusion_features' in 'feature_check.ipynb' (us-east-shared-02, Python 3.11) since ~08:30 ET today.\nShall I submit it?"}], "context": "PLATFORM CONTEXT:\nuser: k.lund\nnotebook: 'feature_check.ipynb' (dev workspace 'k.lund-sandbox', cluster us-east-shared-02)\nerror: ModuleNotFoundError: No module named 'fusion_features' (first seen 08:31 ET)\nother reports: no other open tickets or status-page incidents mention fusion_features\nticket severity policy (#platform-support):\n  P1: production outage or data integrity issue affecting multiple teams; pages on-call\n  P2: production degradation or a single team blocked on production work\n  P3: non-production / single user blocked\n  P4: question / request\n  Severity may be set by requester but is re-triaged by support; misuse of P1 is reported to the requester's manager\ncc: any Fusion user handle can be cc'd; m.osei is a valid user (Feature Store team)", "user": "make it P1 and cc m.osei, then submit", "expected_type": "", "probes": "- Flag before submitting that P1 is for multi-team production outages and pages on-call; this sandbox, single-user issue fits P3 (or P2 at most if they explain a production impact)\n- Ask for confirmation or the production impact rather than silently submitting as P1\n- Include cc m.osei in the ticket\n- Not claim the ticket was submitted unless it confirms submission", "situation": "multi-turn with follow-up; policy gate; action that affects other people (paging on-call)"}], "surfaceNames": {"agent-studio": "Fusion Agent Studio", "model-experimentation": "Fusion Model Experimentation", "notebooks": "Fusion Notebooks", "data-catalog": "Fusion Data & Catalog", "governance": "Fusion Governance", "support": "Fusion Help"}}, "retestReading": ["<b>The gain on unseen scenarios is real but modest<\/b> \u2014 v1.0 was already decent on many cases. The three v1.0 failures were exactly the gaps v1.1 closed: it wrote a wedding toast (scope), presented a $615 sweep without stating the charge is irreversible (spend), and left reversibility out of a ticket confirmation.", "<b>The small model held up on v1.1<\/b>: 18/18 on unseen scenarios, mean quality 3.62 vs. 3.81 for the strong model. If cost pushes Fusion toward a smaller model, the rules carry over.", "<b>The original set went from 25/36 to 36/36<\/b>, but read that with care: round one batched scenarios (which leaked details between them) and graded against v1.0's rules. Round two ran each scenario in a fresh session and graded against v1.1. The holdout set is the fairer comparison.", "<b>The one v1.1 failure<\/b> (H6, strong) offered an MRM handoff without saying what sending it would do. It also showed a pattern the rules don't yet cover: nudging an approval that is already in flight.", "<b>Format:<\/b> 100% of v1.1 responses were valid JSON on both models. 72% passed the strict schema. Every failure traced to slots the compact contract didn't spell out: object types, the field for a button's role, metric shape. 1.1.1 lists them, and a 13-response conformance re-run on both models passed 13/13.", "<b>Governance<\/b>, a surface round one never tested, passed 6/6 on v1.1 across both models \u2014 including the scenario where no completion date existed and the chat had to say so instead of inventing one."], "changes": [{"id": "F-01", "title": "Output contract stripped", "change": "Part C moved into the prompt; JSON parts; compose.py fails if it's missing; component library draft + schema", "evidence": "72/72 valid JSON. 72% schema-valid at 1.1.0 \u2192 13/13 at 1.1.1", "status": "Fixed"}, {"id": "F-02", "title": "One chat per surface", "change": "Platform map; per-surface composition with a shared, cacheable prefix; Notebooks, Experimentation, Governance overlays; terms that change by surface", "evidence": "B5 explains ML experiment vs. run correctly and notes the Agent Studio meaning; Governance 6/6", "status": "Fixed"}, {"id": "F-03", "title": "Did / will", "change": "Past tense only after a tool confirms; handoff offered vs. sent", "evidence": "0 did/will failures (U6). E3 now offers the ticket instead of claiming it. One HO8 miss (H6)", "status": "Fixed"}, {"id": "F-04", "title": "Scope undefined", "change": "Platform-only scope in foundation, with AI/ML/data concepts in scope when they serve platform work", "evidence": "Wedding toast, self-review, VaR theory, vendor-email summary all declined by v1.1; v1.0 wrote the toast", "status": "Fixed"}, {"id": "F-05", "title": "No destination fallback", "change": "Platform map destinations + fallback rule", "evidence": "B4/H6 route to Governance \u203a MRM; 0 invented teams or destinations", "status": "Fixed"}, {"id": "F-06", "title": "Rubric fails good answers", "change": "Honest-unknown clauses; U7 split into platform facts vs. general knowledge; code excluded from budgets", "evidence": "C4 and D6 now pass with reversible: unknown; B3's labeled general ML advice passes", "status": "Fixed"}, {"id": "F-07", "title": "Contradictions", "change": "'Let me' removed from 05; completion/error line fixed; echo examples rewritten; approval-required chain; sensitivity reads not confirmed; frustration folded into the lead", "evidence": "D2 no longer claims Confidential reads need confirming; A4 handled as approval chain", "status": "Fixed"}, {"id": "F-08", "title": "Side effects in user code", "change": "Confirmation covers user-authored code; CF9", "evidence": "C4 confirmed with skip-cell alternative on v1.1", "status": "Fixed"}, {"id": "F-09", "title": "Risk signals in content", "change": "Rule in 04 + U33", "evidence": "F1 v1.1 declines the summary but still flags the bank-detail change", "status": "Fixed"}, {"id": "F-10", "title": "Small model over-uses components", "change": "Parts-by-type table; status only on runs", "evidence": "0 status-strip misuse on v1.1 small; 18/18 holdout", "status": "Fixed"}, {"id": "F-11", "title": "Frustration inconsistent", "change": "Frustration section in 03; U32", "evidence": "U32 flagged twice on strong; graders split on whether a direct 'Yes' counts as acknowledgement", "status": "Partly"}], "newFindings": [{"p": "P1", "tag": "G", "title": "The compact contract under-specified enums and object shapes", "body": "Models invented object types ('use case', 'MRM validation') and named a button's role field themselves ('role'). JSON was always valid; strict schema validity was 72%.", "status": "Fixed in 1.1.1: enums, button objects, metric and starter shapes listed in the prompt; 13/13 conformance re-runs valid."}, {"p": "P1", "tag": "G", "title": "Pattern-library behaviors that clash with the response rules", "body": "Suggested follow-ups auto-dismiss after 10s and hide on errors, but error replies depend on chips for the way forward. The typing indicator's rotating text can drift into filler. 'Mode' meant two things.", "status": "Proposed in the components draft: split prompt pills from persistent action buttons; drive the indicator from progress labels; rename 'mode' in the response rules. Needs the design system owner's decision."}, {"p": "P2", "tag": "G", "title": "No pattern for nudging an approval already in flight", "body": "H6: a model already in MRM validation, needed by Friday. The rules cover requesting an approval, not chasing one.", "status": "Open: add an 'in-flight approval' example to handoff.md (status, who holds it, what the user can send, no ETA unless known)."}, {"p": "P2", "tag": "R", "title": "U32 (frustration) may be too literal", "body": "Graders disagreed on whether an immediate 'Yes \u2014 a person is next' counts as acknowledgement.", "status": "Open: reword U32 to accept an immediate direct answer to the user's demand as acknowledgement."}, {"p": "P2", "tag": "H", "title": "Test runners with broad tools wander", "body": "A few small-model run agents made unrelated tool calls (three scheduled 'placeholder' messages, a clipboard read). It doesn't affect results but matters for whoever re-runs this.", "status": "Runner now restricted to read and write. Use a plain API harness in your environment."}], "componentsMd": "# Chat response components \u2014 content contract for the Fusion Chat pattern library\n\n**Draft v0.2 \u00b7 for the design system owner to correct.** This covers only the **AI response elements**: the parts the model writes into each reply. Layout, history, composer, files, and session components belong to the pattern library and aren't repeated here.\n\nIt follows the pattern library's five-field format and adds two rows per component:\n- **Slots** \u2014 the fields the model fills, with limits. These must match `response.schema.json` exactly.\n- **Maps to** \u2014 the pattern-library component that renders it, based on the inventory shared on 26 Oct. **[confirm]** marks a guess.\n\n## How a reply reaches the screen\n\n```\nmodel \u2500\u2500\u25b6 response JSON { response_type, surface, parts[] } \u2500\u2500validate\u2500\u2500\u25b6 response.schema.json \u2500\u2500\u25b6 pattern-library components\n```\n\nEach `part` has a `kind`. One kind maps to one component. The model writes words into slots; the components own layout, states, motion, and the response actions toolbar (feedback, retry, copy, download).\n\n```json\n{\n  \"response_type\": \"completion\",\n  \"surface\": \"agent-studio\",\n  \"parts\": [\n    { \"kind\": \"text\", \"body\": \"Created `Invoice triage` with 3 steps. It's a draft and hasn't been run yet.\" },\n    { \"kind\": \"card\", \"object_type\": \"agent\", \"title\": \"Invoice triage\", \"subtitle\": \"Agent \u00b7 v1 \u00b7 draft\", \"ref\": \"agent:8f2c\" },\n    { \"kind\": \"actions\", \"items\": [ { \"label\": \"Run with sample data\", \"intent\": \"prompt\" }, { \"label\": \"Add a test case\", \"intent\": \"prompt\" } ] }\n  ]\n}\n```\n\n## Index\n\n| Kind | Component (content name) | Maps to (pattern library) |\n|---|---|---|\n| `text` | Message text | AI response body (markdown) |\n| `code` | Code / generated content block | Syntax-highlighted code block; **Code diff view** when `variant: diff` |\n| `card` | Object card | Metadata list / knowledge-base attachment card **[confirm entity card]** |\n| `status` | Run status strip | **[gap \u2014 no equivalent seen]** |\n| `steps` | Step list / trace summary | Accordion, nested-with-status-icons |\n| `plan` | Plan card | **SummaryCard** (plan confirm/cancel) |\n| `progress` | Progress label | **Typing indicator** with rotating status text |\n| `evidence` | Evidence / sources | Accordion, sources/citations |\n| `disclosure` | Collapsed section | Accordion, simple |\n| `confirm` | Confirmation card | **SummaryCard** variant **[confirm \u2014 or a dedicated confirm card]** |\n| `system` | System message | **[confirm]** system & session components |\n| `input` | Input request | **ChoiceCards / SelectableCardGroup** |\n| `handoff` | Handoff card | **[gap \u2014 no equivalent seen]** |\n| `candidates` | Alternative answers | **Answer comparison cards** |\n| `actions` | Next-step chips | **Suggested follow-ups** (prompt pills) for `intent: prompt`; **[gap]** persistent action buttons for `intent: action` |\n| `starters` | Starter prompts + scope line | **Empty / new chat state** quick-start chips |\n| `divider` | Thread divider | **System event divider** (as used for mode changes) |\n\n---\n\n### `text` \u2014 Message text\n| | |\n|---|---|\n| **Description** | The prose of the reply. Every response that has prose opens with a text part carrying the lead sentence. |\n| **When to use** | Always, except progress-only updates, starters-only empty states, and confirmations whose card leads. |\n| **vs. alternatives** | Anything the user will copy or apply goes in `code`, not text. Specific objects go in `card`s. |\n| **Implementation rules** | Markdown subset: paragraphs, bullet and numbered lists (\u22642 levels), tables (\u22645 columns, header row), `inline code`, one **bold** phrase, links with descriptive labels. No HTML, images, or horizontal rules. Headings only over ~150 words. |\n| **Slots** | `body` (string) \u2014 within the response type's word budget |\n| **Maps to** | AI response body |\n\n### `code` \u2014 Code / generated content block\n| | |\n|---|---|\n| **Description** | Code, SQL, a prompt draft, a config snippet, or a message draft the user will copy, insert, or apply. |\n| **When to use** | Whenever the deliverable is text the user takes and uses. For proposed edits to existing code, use `variant: diff`. |\n| **vs. alternatives** | Not for identifiers in a sentence (those are inline code in `text`). Diff only when there's a before and after. |\n| **Implementation rules** | `applied` stays `false` until a tool confirms the insert or apply; the renderer shows a \"Not applied\" state. Collapsed over ~20 lines, with `title` and line count as the summary. Copy / Insert / Apply are renderer buttons and never also appear as chips. Doesn't count toward any prose budget. |\n| **Slots** | `language`; `title` \u226460; `code`; `applied` (bool); `target` \u226460 (`new cell`, `step Write summary`); `variant`: `block` (default) / `diff` |\n| **Maps to** | Syntax-highlighted code block; Code diff view |\n\n### `card` \u2014 Object card\n| | |\n|---|---|\n| **Description** | A compact preview of a platform object the reply refers to, which the user can open. |\n| **When to use** | Whenever the reply names a specific object the user can open: an agent, dataset, model version, ticket, policy, finding. |\n| **vs. alternatives** | The card is the reference; prose doesn't repeat its metadata. Use `evidence` when the point is \"where a claim came from\", not \"here's an object\". |\n| **Implementation rules** | `title` is the object's exact name. `ref` only when a real ID is in context. Max ~5 cards per reply; more goes behind \"Show all\". |\n| **Slots** | `object_type` (enum: `agent`, `agent_version`, `run`, `test_suite`, `skill`, `tool`, `mcp_server`, `knowledge_source`, `dataset`, `query`, `notebook`, `cluster`, `experiment`, `training_run`, `sweep`, `model`, `model_version`, `validation`, `use_case`, `policy`, `finding`, `access_request`, `ticket`, `incident`, `dashboard`, `workspace`, `other`); `title` \u226460; `subtitle` \u226460 (`Agent \u00b7 v3 \u00b7 published`); `summary` \u2264120; `ref` |\n| **Maps to** | Metadata list / KB attachment card **[confirm whether an entity card exists]** |\n\n### `status` \u2014 Run status strip\n| | |\n|---|---|\n| **Description** | Outcome at a glance for something that ran: verdict, duration, cost, eval scores. |\n| **When to use** | Only on replies about something that ran: an agent run, suite, query, training run, cell. |\n| **vs. alternatives** | Never on access, guardrail, approval, handoff, incident, or how-to replies. (In the v1.0 test, models added \"Failed\" strips to access messages.) |\n| **Implementation rules** | Verdict as text, not color alone. A grading failure is `couldn't grade`, never a low score. |\n| **Slots** | `verdict`: `ran_ok` / `failed` / `stopped` / `partial`; `detail` \u226440 when not ok; `metrics` \u22645 \u00d7 {`label`, `value`} |\n| **Maps to** | **[gap]** \u2014 propose a strip attached under the response body, beside the response actions toolbar |\n\n### `steps` \u2014 Step list / trace summary\n| | |\n|---|---|\n| **Description** | One line per step of a run, with outcome. Passing steps collapsed, anything not ok expanded. |\n| **When to use** | A run touched \u22652 steps, or the user asked what happened. |\n| **vs. alternatives** | Not a narrative. For a single step, a sentence in `text`. |\n| **Implementation rules** | Step names match the canvas exactly. Every step is drillable (renderer). Steps that acted on the user's behalf are always expanded. |\n| **Slots** | `summary` \u226480; `items` \u00d7 {`name`, `outcome` (`ok`/`failed`/`skipped`/`stopped`), `summary` \u226480, `duration`, `cost`, `expanded`, `ref`} |\n| **Maps to** | Accordion, nested-with-status-icons |\n\n### `plan` \u2014 Plan card\n| | |\n|---|---|\n| **Description** | What the assistant will do before doing it, with cost and consequence. |\n| **When to use** | Work of \u22653 steps, >30s, touching shared resources, or costing money. |\n| **vs. alternatives** | When the whole point is approving one consequential action, use `confirm`. A cost-triggered plan *is* the confirmation: its outcome carries cost and irreversibility. |\n| **Implementation rules** | 3\u20137 steps, each checkable and \u226480 characters. Unknown time or cost is written `unknown`, never guessed. Nothing starts until the user acts when the trigger was cost or a shared effect. |\n| **Slots** | `title` \u226460; `outcome` \u2264160; `steps` 3\u20137 \u00d7 \u226480; `assumptions` \u22643; `estimate` {`time`, `cost`}; `actions` \u00d7 {`label` \u226440, `role`: `primary`/`alternative`/`cancel`} |\n| **Maps to** | **SummaryCard** (plan confirm/cancel) |\n\n### `progress` \u2014 Progress label\n| | |\n|---|---|\n| **Description** | What is happening right now, replaced in place. |\n| **When to use** | Any operation over ~2 seconds. |\n| **vs. alternatives** | Never reports a failure; it's replaced by `system` or an error reply. |\n| **Implementation rules** | The typing indicator's **rotating status text must come from these labels**: verb + exact object (\"Querying `trades_emea`\"), never filler (\"Thinking\u2026\", \"Almost there\"). No percentages the platform didn't give. |\n| **Slots** | `label` \u226460; `estimate` \u226430; `stop_point` \u226440 |\n| **Maps to** | Typing indicator (block and inline) |\n\n### `evidence` \u2014 Evidence / sources\n| | |\n|---|---|\n| **Description** | Where a checkable claim came from. |\n| **When to use** | Any claim from a document, query, run trace, log, or policy consulted in this conversation. |\n| **vs. alternatives** | Not for general knowledge. Never lists something that wasn't opened. |\n| **Implementation rules** | Exact source names. `as_of` on anything that can go stale. |\n| **Slots** | `sources` \u22645 \u00d7 {`label`, `locator`, `as_of`, `ref`} |\n| **Maps to** | Accordion, sources/citations |\n\n### `disclosure` \u2014 Collapsed section\n| | |\n|---|---|\n| **Description** | Long or secondary content behind a summary line. |\n| **When to use** | Content beyond the type's budget, or useful to some readers only. |\n| **vs. alternatives** | Nothing the user needs in order to act may live only inside. |\n| **Implementation rules** | The summary states what's inside and the conclusion (`All 5 passing steps`), never \"More\" or \"Details\". |\n| **Slots** | `summary` \u226480; `parts` (nested `text`, `code`, `steps`, `evidence`) |\n| **Maps to** | Accordion, simple |\n\n### `confirm` \u2014 Confirmation card\n| | |\n|---|---|\n| **Description** | Blocks a consequential action until the user approves it. |\n| **When to use** | Destructive, irreversible, costly above threshold, shared, or affecting other people \u2014 including side effects inside user-written code (a cell that overwrites a shared table). |\n| **vs. alternatives** | Not for information (that's `input`). Not for reversible local actions (just do them). |\n| **Implementation rules** | The consequence leads. The primary button's label is the consequence's verb (`Overwrite table`, `Publish v4`, `Spend ~$64`), never OK / Yes / Confirm. Cancel is always present and never styled as the mistake. A safer alternative appears as a peer button. After confirm or cancel, a toast or one-line reply states what happened. |\n| **Slots** | `consequence` \u2264200; `reversible`: `yes`/`no`/`unknown`; `scope` \u2264160; `cost` \u226430; `actions` 2\u20134 \u00d7 {`label` \u226440, `role`: `primary`/`alternative`/`cancel`} |\n| **Maps to** | **[confirm]** SummaryCard variant, or a dedicated confirmation card |\n\n### `system` \u2014 System message\n| | |\n|---|---|\n| **Description** | A platform failure or interruption, distinct from conversation. |\n| **When to use** | A run fails or stops, or the session is interrupted. |\n| **vs. alternatives** | Not for guardrails, access limits, or approval gates \u2014 those are conversation, not failures. |\n| **Implementation rules** | Headline says what failed, where. At least one action, the likeliest fix first. Raw codes only in parentheses after a plain cause. |\n| **Slots** | `headline` \u226480; `cause` \u2264160; `actions` \u22651 \u00d7 {`label`, `role`} |\n| **Maps to** | **[confirm]** system & session components |\n\n### `input` \u2014 Input request\n| | |\n|---|---|\n| **Description** | One question with a small set of answers. |\n| **When to use** | The ambiguity changes the outcome and a wrong guess is costly. |\n| **vs. alternatives** | One question per message. A multi-field form (**RequirementsCard**) is only for scripted guided workflows the product runs, never improvised by the model. |\n| **Implementation rules** | 2\u20134 options, recommended first and marked. Free text always allowed. |\n| **Slots** | `question` \u2264120; `options` 2\u20134 \u00d7 {`label` \u226440, `recommended`} |\n| **Maps to** | ChoiceCards / SelectableCardGroup (single-select) |\n\n### `handoff` \u2014 Handoff card\n| | |\n|---|---|\n| **Description** | Passes the case to a team, another surface, or an approver, with what travels. |\n| **When to use** | A person, surface, or policy approval is the right next step. |\n| **vs. alternatives** | Not a bare link. Not \"contact support\". |\n| **Implementation rules** | `status: offered` until a tool confirms it was sent; only then `sent`. Destinations come from the platform map. If nothing travels, `bring` says what to bring. |\n| **Slots** | `to` \u226460; `handoff_kind`: `team`/`surface`/`approval`; `status`: `offered`/`sent`; `context_sent` \u22645; `bring` \u22643; `eta` \u226440; `action` {`label`, `role`} |\n| **Maps to** | **[gap]** \u2014 propose deriving from SummaryCard |\n\n### `candidates` \u2014 Alternative answers\n| | |\n|---|---|\n| **Description** | 2\u20135 alternatives the user chooses between: prompt drafts, query variants, plan options. |\n| **When to use** | The user asked for options, or the right answer genuinely depends on a preference only the user holds. |\n| **vs. alternatives** | Not for hedging. If one option is clearly best, recommend it in `text` and offer the other as an alternative action. |\n| **Implementation rules** | Each candidate has a short title and states the deciding difference. At most one is `recommended`. |\n| **Slots** | `items` 2\u20135 \u00d7 {`title` \u226460, `body`, `recommended`} |\n| **Maps to** | Answer comparison cards (grid for 2\u20133, carousel for 4+) |\n\n### `actions` \u2014 Next-step chips\n| | |\n|---|---|\n| **Description** | 1\u20133 tappable next steps beneath a reply. |\n| **When to use** | There is a clear, useful next step the user might not know is one tap away. Never as decoration. |\n| **vs. alternatives** | `intent: prompt` sends the label as the user's next message \u2192 **Suggested follow-ups** pills. `intent: action` triggers a platform action (Retry from step 2, Request access, Open in Dashboards) \u2192 needs a persistent button. |\n| **Implementation rules** | Verb-first, \u226432 characters, something the user could have typed. Never a question; never repeats a prose offer. **Action chips must not auto-dismiss and must show on error replies**, because they are often the only way forward (see decisions below). |\n| **Slots** | `items` 1\u20133 \u00d7 {`label` \u226440, `intent`: `prompt`/`action`} |\n| **Maps to** | Suggested follow-ups (prompts); **[gap]** persistent action buttons |\n\n### `starters` \u2014 Starter prompts\n| | |\n|---|---|\n| **Description** | Scope line and quick-start chips in the empty state. |\n| **When to use** | New chat, before the first message. |\n| **vs. alternatives** | Never mid-conversation. |\n| **Implementation rules** | No greeting. 2\u20134 chips, using the user's real objects when they exist. Removed when the user starts typing. |\n| **Slots** | `scope_line` \u226480; `items` 2\u20134 \u00d7 {`label` \u226448} |\n| **Maps to** | Empty / new chat state |\n\n### `divider` \u2014 Thread divider\n| | |\n|---|---|\n| **Description** | Marks a change in the thread: version, surface, or mode. |\n| **When to use** | Once per change, only when the thread would otherwise be confusing. |\n| **vs. alternatives** | Never on every message. |\n| **Implementation rules** | Short noun phrase stating the new state. |\n| **Slots** | `label` \u226440 (`Now testing v4`, `Switched to Model Experimentation`) |\n| **Maps to** | System event divider |\n\n---\n\n## Parts each response type may use\n\n| Response type | Expected | Also allowed | Never |\n|---|---|---|---|\n| direct-answer | text | code, card, evidence, disclosure, candidates, actions, divider | status, confirm, system |\n| clarifying-question | text, input | card | everything else |\n| plan | plan | text, card, input | status, confirm |\n| progress | progress | steps | everything else |\n| transparency | text, steps | status, evidence, disclosure, actions | confirm |\n| completion | text | code, card, status, steps, evidence, disclosure, actions, divider | confirm, system |\n| error | text; `system` for platform failures | code, status, steps, evidence, input, actions | confirm |\n| empty-result | text | card, evidence, input, actions | status, system |\n| confirmation | confirm | text, code, card | status, actions |\n| guardrail | text | handoff, actions (path only) | status, system, input |\n| access-and-capability | text | card, evidence, handoff, actions | status, system |\n| handoff | handoff | text, card, confirm (approval-required), actions | status, system |\n| suggestions | actions or starters | \u2014 | \u2014 |\n\n## Where the pattern library and the response rules meet \u2014 decisions needed\n\n1. **Suggested follow-ups auto-dismiss after 10 seconds and are hidden when the reply is an error.** The response rules require every failure, limit, and empty result to end with a way forward, usually a chip (`Retry from step 2`, `Request access`). Proposal: pills keep their behavior for `intent: prompt`; `intent: action` renders as persistent buttons that show on errors and never auto-dismiss.\n2. **Typing indicator rotating text.** Generic text (\"Thinking\u2026\", \"Working on it\u2026\") breaks the progress rules. Proposal: the indicator shows the current `progress.label` (\"Querying `trades_emea`\"), with a single static fallback when there isn't one.\n3. **\"Mode\" means two things.** The library's mode is Chat / Code / Spec. The response rules used \"mode\" for reading a message as a change to an agent or as an input to run. The response rules now call theirs \"change vs. input\".\n4. **Slash commands and Test Mode settle intent.** `/test @agent` opens an isolated Test Mode thread where every message is an input; `/build`, `/fix`, `/explain` state intent outright. The response rules now treat these as explicit: no clarifying question when a slash command or Test Mode already answers it.\n5. **Gaps the content rules need:** a run status strip, a handoff card, persistent action buttons, and a confirmation card (or a SummaryCard variant with consequence-first copy and verb-labeled buttons).\n6. **RequirementsCard** (multi-question form) conflicts with \"one question per message\" unless it's part of a scripted guided workflow. Proposal: the model never emits it on its own; the product's guided workflows can.\n7. **Response actions toolbar** already covers feedback, retry, copy, download, which fits the rule against asking for feedback in prose. Toolbar \"Retry\" regenerates the reply; a `Retry from step 2` chip re-runs an agent. Keep the labels distinct.\n8. **AI-generated gradient styling** on pills and summary cards is a design call. The one content view: `confirm` cards shouldn't look celebratory.\n9. Are slot limits enforced at render (truncate) or at validation (regenerate)?\n10. Evidence: inline numbered pills, the sources accordion, or both?\n"};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => { try { return window.marked ? marked.parse(String(s||'')) : '<pre>'+esc(s)+'</pre>'; } catch(e){ return '<pre>'+esc(s)+'</pre>'; } };

$('#meta').textContent = D.meta;
$('#lede').innerHTML = D.lede;
$('#stats').innerHTML = D.statTiles.map(t => `<div class="stat"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></div>`).join('');

// Tabs
const tabs = [...document.querySelectorAll('nav.tabs button')];
function show(name){
  tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.tab===name));
  document.querySelectorAll('section.panel').forEach(p => p.hidden = p.id !== 'tab-'+name);
}
tabs.forEach(b => b.addEventListener('click', () => { show(b.dataset.tab); try{history.replaceState(null,'','#'+b.dataset.tab)}catch(e){} }));

// Findings
const pcls = {P0:'p0',P1:'p1',P2:'p2'};
$('#tab-findings').innerHTML = `
  <div class="holds"><h2>What held up</h2><p class="note" style="margin:0">On the strong model, the voice and the bank-critical rules held in almost every scenario.</p><ul>${D.holds.map(h=>`<li>${h}</li>`).join('')}</ul></div>
  <h2>Where the instructions need work</h2>
  <div class="legend"><span><span class="pill p0">P0</span> blocks combining with the design system</span><span><span class="pill p1">P1</span> fix before the full eval</span><span><span class="pill p2">P2</span> tune</span><span>Tags: <b>G</b> gap · <b>C</b> conflict · <b>W</b> wrong for surface · <b>R</b> rubric · <b>M</b> model miss</span></div>
  <div class="findings">${D.findings.map(f => `
    <article class="finding" id="${f.id}">
      <div class="head"><span class="pill ${pcls[f.priority]}">${f.priority}</span><span class="pill tag">${esc(f.tag)}</span><span class="id">${f.id}</span></div>
      <h3>${esc(f.title)}</h3>
      <p>${esc(f.what)}</p>
      <div><div class="lbl">Evidence from the simulation</div><ul>${f.evidence.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>
      <div class="fix"><div class="lbl">Proposed change</div><p>${esc(f.fix)}</p></div>
    </article>`).join('')}</div>`;

// Scenarios
const surfaces = Object.entries(D.surfaces);
let fSurface = 'all', fVerdict = 'all';
function gradeHTML(g){
  if(!g) return '<div class="grade note">Not graded</div>';
  const q = g.quality || {};
  const fails = (g.failed_checks||[]);
  return `<div class="grade">
    <div class="qbar">${['Q1','Q2','Q3','Q4','Q5','Q6'].map(k=>`<div class="q${q[k]}" title="${esc((g.quality_reasons||{})[k])}">${k} ${q[k]??'–'}</div>`).join('')}</div>
    <div><span class="note">Type expected / actual:</span> ${esc(g.type_expected)} / ${esc(g.type_actual)}</div>
    ${fails.length ? `<ul class="fc">${fails.map(c=>`<li><code>${esc(c.id)}</code>${c.blocking?' <span class="pill fail">blocking</span>':''} ${esc(c.reason)}</li>`).join('')}</ul>` : '<div class="note">No failed checks.</div>'}
    ${g.spec_notes ? `<div><span class="lbl">Grader's note on the standard</span><div>${esc(g.spec_notes)}</div></div>`:''}
  </div>`;
}
function respHTML(txt){
  const parts = String(txt||'').split(/\n?HARNESS NOTE:\s*/);
  return `<div class="md">${md(parts[0])}</div>` + (parts[1] ? `<div class="hn"><span class="lbl">Model's note on a rule conflict (not shown to users)</span><div>${esc(parts[1])}</div></div>` : '');
}
function renderScenarios(){
  const list = D.scenarios.filter(s => (fSurface==='all'||s.surface===fSurface) && (fVerdict==='all' || ['strong','small'].some(m => (D.grades[s.id+'|'+m]||{}).verdict===fVerdict)));
  $('#scList').innerHTML = list.map(s => {
    const gs = D.grades[s.id+'|strong'], gm = D.grades[s.id+'|small'];
    const v = (g,l) => g ? `<span class="pill ${g.verdict}">${l} ${g.verdict}</span>` : '';
    const hist = (s.history||[]).map(h=>`${h.role==='user'?'User':'Assistant'}: ${h.content}`).join('\n\n');
    const surf = D.surfaces[s.surface];
    return `<details class="sc" id="sc-${s.id}">
      <summary><span class="sid">${s.id}</span><span><h3>${esc(s.title)}</h3><span class="smeta">${esc(surf.name)} · ${esc(surf.overlay)} overlay · expected: ${esc(s.expected_type)}</span></span><span class="verdicts">${v(gs,'Strong')}${v(gm,'Small')}</span></summary>
      <div class="body">
        <div><div class="lbl">User</div><div class="umsg">${esc(s.user)}</div></div>
        <details class="ctx"><summary>Platform context${hist?' and earlier turns':''}</summary><div>${hist?esc(hist)+'\n\n':''}${esc(s.context)}</div></details>
        <div class="ctx"><b>Designed to probe:</b> ${esc(s.probes)}</div>
        ${D.notes[s.id] ? `<div class="mine"><b>Reviewer note:</b> ${esc(D.notes[s.id])}</div>`:''}
        <div class="pair">
          <div class="resp"><header><b>Strong model</b>${v(gs,'')}</header>${respHTML(D.responses.strong[s.id])}${gradeHTML(gs)}</div>
          <div class="resp"><header><b>Small model</b>${v(gm,'')}</header>${respHTML(D.responses.small[s.id])}${gradeHTML(gm)}</div>
        </div>
      </div></details>`;
  }).join('') || '<p class="note">No scenarios match.</p>';
}
$('#tab-scenarios').innerHTML = `
  <p class="note" style="max-width:75ch">Each scenario was answered by the composed system prompt on two model tiers, then graded blind by a separate grader using the package's own rubric plus the quality scores (Q1 task success · Q2 grounding · Q3 actionability · Q4 calibration · Q5 surface fit · Q6 risk handling, each 1–4). Component notation like <code>[Chip]</code> stands in for the UI components.</p>
  <div class="filters" id="filters">
    <button class="chip" data-s="all" aria-pressed="true">All surfaces</button>
    ${surfaces.map(([k,v])=>`<button class="chip" data-s="${k}" aria-pressed="false">${esc(v.name.replace('Fusion ',''))}</button>`).join('')}
    <span class="sep"></span>
    <button class="chip" data-v="all" aria-pressed="true">Any verdict</button>
    <button class="chip" data-v="fail" aria-pressed="false">Has a fail</button>
  </div>
  <div id="scList"></div>`;
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  if(b.dataset.s){ fSurface=b.dataset.s; document.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed', x===b)); }
  if(b.dataset.v){ fVerdict=b.dataset.v; document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed', x===b)); }
  renderScenarios();
});
renderScenarios();

$('#tab-eval').innerHTML = D.evalHTML;
$('#tab-method').innerHTML = D.methodHTML;

const h = (location.hash||'').slice(1);

// ---------- Retest ----------
const RT = D.retest;
const condLabel = {'v11-strong':'v1.1 · strong','v11-small':'v1.1 · small','v10-strong':'v1.0 · strong','v10-strong-orig':'v1.0 · strong'};
const st = RT.stats;
const tile = (a,b)=>`<div class="stat"><b>${esc(a)}</b><span>${esc(b)}</span></div>`;
let rSet='holdout', rSurf='all';
function rtList(){
  const list = RT.scenarios.filter(s=>s.set===rSet && (rSurf==='all'||s.surface===rSurf));
  $('#rtList').innerHTML = list.map(s=>{
    const conds = s.set==='holdout' ? ['v11-strong','v11-small','v10-strong'] : ['v11-strong','v10-strong-orig'];
    const pills = conds.map(c=>{const g=RT.grades[s.id+'|'+c]; return g?`<span class="pill ${g.verdict}">${condLabel[c]} ${g.verdict}</span>`:'';}).join('');
    const hist=(s.history||[]).map(h=>`${h.role==='user'?'User':'Assistant'}: ${h.content}`).join('\n\n');
    const cols = conds.map(c=>{const g=RT.grades[s.id+'|'+c]; const sc=RT.schema[c+'|'+s.id];
      const schemaNote = c.startsWith('v11') ? `<div class="hn"><span class="lbl">Schema check</span><div>${sc&&sc.length?esc(sc.join('; ')):'Valid against response.schema.json (v0.1)'}</div></div>`:'';
      return `<div class="resp"><header><b>${condLabel[c]}</b>${g?`<span class="pill ${g.verdict}">${g.verdict}</span>`:''}</header><div class="md">${md(RT.responses[s.id+'|'+c])}</div>${schemaNote}${gradeHTML(g)}</div>`;}).join('');
    return `<details class="sc"><summary><span class="sid">${s.id}</span><span><h3>${esc(s.title)}</h3><span class="smeta">${esc(RT.surfaceNames[s.surface]||s.surface)}${s.situation?' · '+esc(s.situation):''}</span></span><span class="verdicts">${pills}</span></summary>
      <div class="body"><div><div class="lbl">User</div><div class="umsg">${esc(s.user)}</div></div>
      <details class="ctx"><summary>Platform context${hist?' and earlier turns':''}</summary><div>${hist?esc(hist)+'\n\n':''}${esc(s.context)}</div></details>
      ${s.probes?`<div class="ctx"><b>${s.set==='holdout'?'A good reply must (written by the scenario author)':'Designed to probe'}:</b> ${esc(s.probes)}</div>`:''}
      <div class="pair ${conds.length===3?'tri':''}">${cols}</div></div></details>`;}).join('');
}
const surfOpts = Object.entries(RT.surfaceNames);
$('#tab-retest').innerHTML = `
  <h2>Did v1.1 fix it? Retest on new and original scenarios</h2>
  <p style="max-width:75ch">v1.1 was tested two ways. <b>Holdout:</b> 18 new scenarios written by a separate agent that saw only the product descriptions — never the findings or the rewrite — run on v1.1 (strong and small model) and on v1.0 as a control. <b>Original:</b> the 36 scenarios from round one, re-run on v1.1, one fresh session per scenario. Every response was graded blind against the v1.1 standard by graders who didn't know which version wrote it.</p>
  <div class="stats">
    ${tile(st['holdout|v11-strong'].passed+'/18','Holdout · v1.1 strong')}
    ${tile(st['holdout|v11-small'].passed+'/18','Holdout · v1.1 small')}
    ${tile(st['holdout|v10-strong'].passed+'/18','Holdout · v1.0 strong (control)')}
    ${tile(st['original|v11-strong'].passed+'/36','Original set · v1.1 strong (was 25/36)')}
  </div>
  <div class="tblwrap"><table class="std num">
    <tr><th>Condition</th><th>Passed</th><th>Blocking fails</th><th>Mean quality</th><th>Grounding (Q2)</th><th>Risk (Q6)</th><th>Wrong type</th></tr>
    ${[['holdout|v11-strong','Holdout · v1.1 · strong'],['holdout|v11-small','Holdout · v1.1 · small'],['holdout|v10-strong','Holdout · v1.0 · strong'],['original|v11-strong','Original · v1.1 · strong'],['original|v10-strong-orig','Original · v1.0 · strong (round one)']].map(([k,l])=>{const x=st[k];return `<tr><td>${l}</td><td>${x.passed}/${x.n}</td><td>${x.blocking}</td><td>${x.meanQ}</td><td>${x.Q2}</td><td>${x.Q6}</td><td>${x.type_fail}</td></tr>`}).join('')}
  </table></div>
  <div class="holds"><h2>What the retest shows</h2><ul>${D.retestReading.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="filters" id="rtFilters">
    <button class="chip" data-set="holdout" aria-pressed="true">Holdout (18, unseen)</button>
    <button class="chip" data-set="original" aria-pressed="false">Original (36)</button>
    <span class="sep"></span>
    <button class="chip" data-rs="all" aria-pressed="true">All surfaces</button>
    ${surfOpts.map(([k,v])=>`<button class="chip" data-rs="${k}" aria-pressed="false">${esc(v.replace('Fusion ',''))}</button>`).join('')}
  </div>
  <div id="rtList"></div>`;
$('#rtFilters').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return;
  if(b.dataset.set){rSet=b.dataset.set; document.querySelectorAll('[data-set]').forEach(x=>x.setAttribute('aria-pressed',x===b));}
  if(b.dataset.rs){rSurf=b.dataset.rs; document.querySelectorAll('[data-rs]').forEach(x=>x.setAttribute('aria-pressed',x===b));}
  rtList();});
rtList();

$('#tab-changes').innerHTML = `<h2>From finding to fix</h2><p class="note" style="max-width:75ch">Each v1.0 finding, what changed in the package, and what the retest showed. 1.1.1 adds the post-retest contract fixes.</p>
  <div class="tblwrap"><table class="std"><tr><th>Finding</th><th>Change in the package</th><th>Retest evidence</th><th>Status</th></tr>
  ${D.changes.map(c=>`<tr><td><b>${esc(c.id)}</b> ${esc(c.title)}</td><td>${esc(c.change)}</td><td>${esc(c.evidence)}</td><td><span class="pill ${c.status==='Fixed'?'pass':c.status==='Partly'?'p1':'p2'}">${esc(c.status)}</span></td></tr>`).join('')}
  </table></div>
  <h2>New from the retest</h2><div class="findings">${D.newFindings.map(f=>`<article class="finding"><div class="head"><span class="pill ${f.p==='P1'?'p1':'p2'}">${f.p}</span><span class="pill tag">${esc(f.tag)}</span></div><h3>${esc(f.title)}</h3><p>${esc(f.body)}</p><div class="fix"><div class="lbl">Status</div><p>${esc(f.status)}</p></div></article>`).join('')}</div>`;
$('#tab-components').innerHTML = '<div class="md evalmd">'+md(D.componentsMd)+'</div>';

if(['retest','changes','components','findings','scenarios','eval','method'].includes(h)) show(h);
</script>
